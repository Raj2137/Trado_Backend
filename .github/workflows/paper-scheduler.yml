name: Trado paper scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: trado-paper-portfolio
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PAPER_TRADING: "true"
      TOTAL_CAPITAL_USDT: "100"
      LLM_ADVISOR_ENABLED: "false"
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Download repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check database configuration
        run: |
          python - <<'PY'
          import os
          from sqlalchemy.engine import make_url

          value = os.environ.get("DATABASE_URL", "")
          if not value:
              raise SystemExit("Add the DATABASE_URL repository secret.")
          if make_url(value).get_backend_name() != "postgresql":
              raise SystemExit("DATABASE_URL must use PostgreSQL.")
          print("Database configuration is present.")
          PY

      - name: Run one paper trading cycle
        run: python -m app.run_cycle --trade-mode paper
